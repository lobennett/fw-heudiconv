name: Offline tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install package and declared test dependencies
        run: |
          python -m pip install .
          python -m pip check
      - name: Run offline unit tests and doctests
        # Deselect before execution: test_client constructs a credentialed live client.
        run: >-
          python -m pytest -v -ra --doctest-modules --cov=fw_heudiconv
          testing fw_heudiconv
          --deselect=testing/test_fwheudiconv.py::test_client
