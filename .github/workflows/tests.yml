name: Offline tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install package and declared test dependencies
        run: |
          python -m pip install .
          python -m pip check
      - name: Run offline unit tests and doctests
        # Deselect before execution: test_client constructs a credentialed live client.
        run: >-
          python -m pytest -v -ra --doctest-modules --cov=fw_heudiconv
          testing fw_heudiconv
          --deselect=testing/test_fwheudiconv.py::test_client
